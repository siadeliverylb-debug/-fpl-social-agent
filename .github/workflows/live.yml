name: FPL Live Events

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual posting)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-state
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Poll repeatedly for ~4 minutes
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          # GitHub's own schedule trigger is "best effort" and gets delayed
          # under load, often well past the configured 5-minute cron -- so
          # each firing polls several times internally (fast, ~40s apart)
          # instead of relying on the outer schedule for granularity.
          git config user.name "fpl-social-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            python scripts/orchestrate.py live ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
            git add state.json assets/generated
            git diff --cached --quiet || git commit -m "Live: post match events [skip ci]"
            git pull --rebase
            git push
            if [ "$i" -lt 6 ]; then sleep 40; fi
          done
