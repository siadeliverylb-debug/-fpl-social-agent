name: Slack Drafts Cleanup (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-state
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run cleanup
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/cleanup_slack_drafts.py

      - name: Commit updated state
        run: |
          git config user.name "fpl-social-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Cleanup: remove stale pre-auto_mode Slack drafts [skip ci]"
          git pull --rebase
          git push
