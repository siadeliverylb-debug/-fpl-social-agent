name: FPL News Scan

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip Slack post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-state-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python scripts/orchestrate.py scan ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit updated state and generated cards
        run: |
          git config user.name "fpl-social-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json assets/generated
          git diff --cached --quiet || git commit -m "Scan: update state and queued drafts [skip ci]"
          # Each workflow now has its own concurrency group (see below), so a
          # push here can race against scan/publish/live pushing at the same
          # moment -- retry the pull-rebase-push cycle instead of losing this
          # run's work to a single rejected push.
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 10 + 3))
          done
