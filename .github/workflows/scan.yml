name: FPL News Scan

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip Slack post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python scripts/orchestrate.py scan ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit updated state and generated cards
        run: |
          git config user.name "fpl-social-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json assets/generated
          git diff --cached --quiet || git commit -m "Scan: update state and queued drafts [skip ci]"
          git pull --rebase
          git push
